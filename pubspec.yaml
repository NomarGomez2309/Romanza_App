name: romanza
description: "Romanza: base Flutter con servicios Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  camera: ^0.12.0+2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Fredoka-OFL.txt
    - assets/fonts/Nunito-OFL.txt
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
